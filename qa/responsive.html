<!doctype html><html><head><meta name="robots" content="noindex"><title>MOST responsive QA</title><style>body{margin:0;background:#ddd;font:14px system-ui}nav{padding:10px;display:flex;gap:15px}iframe{display:block;margin:0 auto;border:0;height:844px;background:white;max-width:none}label{display:flex;gap:8px}</style></head><body><nav><label>Okruženje<select id="origin"><option value="https://moststudioba.com">Produkcija</option><option value="">Lokalno</option></select></label><label>Stranica<select id="route"><option value="/">Početna</option><option value="/kontakt">Kontakt</option><option value="/moststudiowebshop">Webshop</option><option value="/demo/stolarija-hrast">Hrast</option><option value="/demo/ordinacija-lipa">Lipa</option><option value="/demo/meridijan-savjetovanje">Meridijan</option><option value="/de">Deutsch</option><option value="/usluge/izrada-web-stranica">Usluga</option></select></label><label>Širina<select id="width"><option>320</option><option>360</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1440</option></select></label><button id="reload">Ponovo učitaj</button></nav><iframe name="audit" title="Testirani sajt" width="405" src="https://moststudioba.com/"></iframe><script>const frame=document.querySelector('iframe');function load(){frame.src=document.querySelector('#origin').value+document.querySelector('#route').value}document.querySelector('#route').onchange=load;document.querySelector('#origin').onchange=load;document.querySelector('#width').onchange=e=>frame.width=Number(e.target.value)+15;document.querySelector('#reload').onclick=load;</script></body></html>
